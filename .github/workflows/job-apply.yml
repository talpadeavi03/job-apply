name: AetherApply Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: aetherapply
  cancel-in-progress: false

jobs:
  automation:
    name: Discover Jobs & Apply
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
      NAUKRI_AT: ${{ secrets.NAUKRI_AT }}
      NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v tests/

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Install Playwright System Dependencies
        run: |
          playwright install-deps chromium

      - name: Create Runtime Directories
        run: |
          mkdir -p logs
          mkdir -p data
          mkdir -p storage
          mkdir -p screenshots

      - name: Run Job Automation
        run: |
          python -m apps.main

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload Database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database
          path: |
            data/
            storage/

      - name: Workflow Summary
        if: always()
        run: |
          echo "## AetherApply Finished" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow completed." >> $GITHUB_STEP_SUMMARY
          echo "- Check uploaded artifacts for logs." >> $GITHUB_STEP_SUMMARY

      - name: Alert Discord on Pipeline Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -s -H "Content-Type: application/json" \
              -X POST \
              -d '{"username": "AetherApply Monitor", "embeds": [{"title": "🚨 AetherApply Workflow Failed", "description": "The automated 4-hour workflow encountered an unexpected failure on GitHub Actions runner. Check workflow logs.", "color": 15158332, "fields": [{"name": "Branch", "value": "${{ github.ref_name }}", "inline": true}, {"name": "Run ID", "value": "[View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}]}]}' \
              "${{ secrets.DISCORD_WEBHOOK_URL }}"
          fi