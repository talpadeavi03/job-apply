name: Test Gmail Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Secrets
        env:
          CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          echo "Client ID exists: ${#CLIENT_ID}"
          echo "Client Secret exists: ${#CLIENT_SECRET}"
          echo "Refresh Token exists: ${#REFRESH_TOKEN}"